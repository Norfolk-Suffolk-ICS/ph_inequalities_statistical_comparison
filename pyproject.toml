[project]
name = "ph-inequalities-statistical-comparison"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nickpsneeif", email = "nicholas.philo@suffolk.gov.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "polars>=1.43.0",
    "scipy>=1.18.0",
]

[project.scripts]
ph-inequalities-statistical-comparison = "ph_inequalities_statistical_comparison:main"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
